<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - El Truco Barbería</title>
    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-gold: #c5a059; /* Tono elegante acorde al estilo */
            --accent-blue: #009EE3; /* Mercado Pago */
            --success-color: #00a650;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        /* Área del Logo Personalizado */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .barber-logo-badge {
            width: 90px;
            height: 90px;
            background: #1c1c1c;
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .brand-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 11px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .mp-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 158, 227, 0.1);
            color: var(--accent-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 22px;
            border: 1px solid rgba(0, 158, 227, 0.2);
        }

        .field-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .field-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-box {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .copy-box:focus-within {
            border-color: var(--accent-gold);
        }

        .copy-box input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            font-weight: 500;
        }

        .copy-btn {
            background-color: var(--accent-gold);
            color: #0b0b0b;
            border: none;
            padding: 0 16px;
            height: 100%;
            min-height: 44px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background-color: var(--success-color);
            color: white;
        }

        .instructions {
            margin-top: 22px;
            font-size: 12px;
            color: #d1d5db;
            background: rgba(197, 160, 89, 0.08);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            line-height: 1.4;
        }

        .instructions strong {
            color: var(--accent-gold);
        }

        footer {
            margin-top: 22px;
            font-size: 11px;
            color: #6b7280;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo y Encabezado Personalizado -->
        <div class="logo-container">
            <div class="barber-logo-badge">
                🎩
            </div>
            <div class="brand-header">
                <h1>EL TRUCO BARBERÍA</h1>
                <p>Est. 2018</p>
            </div>
        </div>

        <div class="mp-badge">
            <span>💳</span> Mercado Pago - Transferencias
        </div>

        <!-- Titular -->
        <div class="field-group">
            <label>👤 Titular</label>
            <div class="copy-box">
                <input type="text" id="titular" value="Ismael Condori Huarayo" readonly>
                <button class="copy-btn" onclick="copyText('titular', this)">Copiar</button>
            </div>
        </div>

        <!-- RUT -->
        <div class="field-group">
            <label>🆔 RUT</label>
            <div class="copy-box">
                <input type="text" id="rut" value="294120262" readonly>
                <button class="copy-btn" onclick="copyText('rut', this)">Copiar</button>
            </div>
        </div>

        <!-- Tipo de Cuenta -->
        <div class="field-group">
            <label>🏦 Tipo de cuenta</label>
            <div class="copy-box">
                <input type="text" id="tipo-cuenta" value="Cuenta Vista" readonly>
                <button class="copy-btn" onclick="copyText('tipo-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Número de cuenta -->
        <div class="field-group">
            <label>💳 Número de cuenta</label>
            <div class="copy-box">
                <input type="text" id="num-cuenta" value="1087437293" readonly>
                <button class="copy-btn" onclick="copyText('num-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Correo -->
        <div class="field-group">
            <label>✉️ Correo electrónico</label>
            <div class="copy-box">
                <input type="text" id="correo" value="ismael558@icloud.com" readonly>
                <button class="copy-btn" onclick="copyText('correo', this)">Copiar</button>
            </div>
        </div>

        <div class="instructions">
            <strong>⚠️ Importante:</strong> Después de realizar tu transferencia, recuerda enviar el comprobante al barbero para validar tu servicio.
        </div>

        <footer>
            El Truco Barbería • Todos los derechos reservados
        </footer>
    </div>

    <script>
        function copyText(elementId, buttonElement) {
            const inputElement = document.getElementById(elementId);
            
            navigator.clipboard.writeText(inputElement.value).then(() => {
                const originalText = buttonElement.innerHTML;
                
                buttonElement.innerHTML = '¡Copiado!';
                buttonElement.classList.add('copied');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalText;
                    buttonElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>
</body>
</html>
