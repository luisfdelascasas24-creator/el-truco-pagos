<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - El Truco Barbería</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-blue: #009EE3;
            --whatsapp-color: #25D366;
            --whatsapp-hover: #1EBE5D;
            --success-color: #00a650;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
        }

        .payment-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(0, 158, 227, 0.12);
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 158, 227, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .field-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-box {
            display: flex;
            align-items: center;
            background: #1c1c1c;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .copy-box:focus-within {
            border-color: #ffffff;
        }

        .copy-box input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            font-weight: 600;
        }

        .copy-btn {
            background-color: #ffffff;
            color: #0b0b0b;
            border: none;
            padding: 0 16px;
            height: 100%;
            min-height: 46px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover {
            background-color: #e0e0e0;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background-color: var(--success-color);
            color: white;
        }

        .instructions {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.4;
        }

        .instructions strong {
            color: #ffffff;
        }

        /* Botón de WhatsApp */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--whatsapp-color);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            margin-top: 16px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .whatsapp-btn:hover {
            background-color: var(--whatsapp-hover);
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 22px;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="El Truco Barbería Logo">
        </div>

        <div class="payment-badge">
            <span>💳</span> Mercado Pago
        </div>

        <!-- Titular -->
        <div class="field-group">
            <label for="titular">Titular</label>
            <div class="copy-box">
                <input type="text" id="titular" value="Ismael Condori Huarayo" readonly>
                <button class="copy-btn" onclick="copyText('titular', this)">Copiar</button>
            </div>
        </div>

        <!-- RUT -->
        <div class="field-group">
            <label for="rut">RUT</label>
            <div class="copy-box">
                <input type="text" id="rut" value="294120262" readonly>
                <button class="copy-btn" onclick="copyText('rut', this)">Copiar</button>
            </div>
        </div>

        <!-- Tipo de Cuenta -->
        <div class="field-group">
            <label for="tipo-cuenta">Tipo de cuenta</label>
            <div class="copy-box">
                <input type="text" id="tipo-cuenta" value="Cuenta Vista" readonly>
                <button class="copy-btn" onclick="copyText('tipo-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Número de cuenta -->
        <div class="field-group">
            <label for="num-cuenta">Número de cuenta</label>
            <div class="copy-box">
                <input type="text" id="num-cuenta" value="1087437293" readonly>
                <button class="copy-btn" onclick="copyText('num-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Correo -->
        <div class="field-group">
            <label for="correo">Correo electrónico</label>
            <div class="copy-box">
                <input type="text" id="correo" value="ismael558@icloud.com" readonly>
                <button class="copy-btn" onclick="copyText('correo', this)">Copiar</button>
            </div>
        </div>

        <div class="instructions">
            <strong>⚠️ Importante:</strong> Después de realizar la transferencia, envíanos tu comprobante haciendo clic en el botón de abajo.
        </div>

        <!-- Botón Directo de WhatsApp -->
        <a href="https://wa.me/56922108626?text=Hola,%20adjunto%20el%20comprobante%20de%20mi%20transferencia%20para%20El%20Truco%20Barbería." class="whatsapp-btn" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.012-.304.087-.403.088-.088.197-.23.296-.345.1-.115.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.078.38-.057 1.17-.478 1.338-.94.17-.463.17-.86.119-.948-.05-.084-.182-.133-.38-.232z"/>
            </svg>
            Enviar Comprobante por WhatsApp
        </a>

        <footer>
            El Truco Barbería © 2026
        </footer>
    </div>

    <script>
        function copyText(elementId, buttonElement) {
            const inputElement = document.getElementById(elementId);
            
            navigator.clipboard.writeText(inputElement.value).then(() => {
                const originalText = buttonElement.innerHTML;
                
                buttonElement.innerHTML = '¡Copiado!';
                buttonElement.classList.add('copied');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalText;
                    buttonElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>
</body>
</html>
