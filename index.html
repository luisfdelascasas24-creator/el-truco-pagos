<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - El Truco Barbería</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-blue: #009EE3;
            --success-color: #00a650;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        /* Contenedor circular perfecto para el logo */
        .logo-wrapper {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
        }

        .payment-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(0, 158, 227, 0.12);
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 158, 227, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .field-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-box {
            display: flex;
            align-items: center;
            background: #1c1c1c;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .copy-box:focus-within {
            border-color: #ffffff;
        }

        .copy-box input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            font-weight: 600;
        }

        .copy-btn {
            background-color: #ffffff;
            color: #0b0b0b;
            border: none;
            padding: 0 16px;
            height: 100%;
            min-height: 46px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover {
            background-color: #e0e0e0;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background-color: var(--success-color);
            color: white;
        }

        .instructions {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.4;
        }

        .instructions strong {
            color: #ffffff;
        }

        footer {
            margin-top: 22px;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo perfectamente adaptado al círculo -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="El Truco Barbería Logo">
        </div>

        <div class="payment-badge">
            <span>💳</span> Mercado Pago
        </div>

        <!-- Titular -->
        <div class="field-group">
            <label for="titular">Titular</label>
            <div class="copy-box">
                <input type="text" id="titular" value="Ismael Condori Huarayo" readonly>
                <button class="copy-btn" onclick="copyText('titular', this)">Copiar</button>
            </div>
        </div>

        <!-- RUT -->
        <div class="field-group">
            <label for="rut">RUT</label>
            <div class="copy-box">
                <input type="text" id="rut" value="294120262" readonly>
                <button class="copy-btn" onclick="copyText('rut', this)">Copiar</button>
            </div>
        </div>

        <!-- Tipo de Cuenta -->
        <div class="field-group">
            <label for="tipo-cuenta">Tipo de cuenta</label>
            <div class="copy-box">
                <input type="text" id="tipo-cuenta" value="Cuenta Vista" readonly>
                <button class="copy-btn" onclick="copyText('tipo-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Número de cuenta -->
        <div class="field-group">
            <label for="num-cuenta">Número de cuenta</label>
            <div class="copy-box">
                <input type="text" id="num-cuenta" value="1087437293" readonly>
                <button class="copy-btn" onclick="copyText('num-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Correo -->
        <div class="field-group">
            <label for="correo">Correo electrónico</label>
            <div class="copy-box">
                <input type="text" id="correo" value="ismael558@icloud.com" readonly>
                <button class="copy-btn" onclick="copyText('correo', this)">Copiar</button>
            </div>
        </div>

        <div class="instructions">
            <strong>⚠️ Importante:</strong> Después de realizar la transferencia, recuerda enviar el comprobante para validar tu pago en el local.
        </div>

        <footer>
            El Truco Barbería © 2026
        </footer>
    </div>

    <script>
        function copyText(elementId, buttonElement) {
            const inputElement = document.getElementById(elementId);
            
            navigator.clipboard.writeText(inputElement.value).then(() => {
                const originalText = buttonElement.innerHTML;
                
                buttonElement.innerHTML = '¡Copiado!';
                buttonElement.classList.add('copied');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalText;
                    buttonElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>
</body>
</html>
