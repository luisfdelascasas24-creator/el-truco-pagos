<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - El Truco Barbería</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-blue: #009EE3; /* Mercado Pago */
            --success-color: #00a650;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* Patrón sutil de fondo inspirado en las herramientas de la barbería */
            background-image: radial-gradient(circle at 50% 50%, #161616 0%, #0b0b0b 100%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
        }

        /* Réplica exacta del Emblema / Logo de la Barbería */
        .logo-emblem {
            width: 120px;
            height: 120px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            margin: 0 auto 18px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid #1a1a1a;
            box-shadow: 0 0 0 2px #ffffff, 0 8px 25px rgba(0,0,0,0.5);
            position: relative;
            padding: 10px;
        }

        .logo-emblem .hat {
            font-size: 32px;
            line-height: 1;
            margin-bottom: -2px;
        }

        .logo-emblem .brand-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .logo-emblem .brand-subtitle {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            margin-top: 2px;
            padding: 1px 0;
            width: 80%;
        }

        .logo-emblem .estd {
            font-size: 7px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .section-divider {
            width: 60%;
            height: 1px;
            background: var(--border-color);
            margin: 20px auto;
            position: relative;
        }

        .section-divider::after {
            content: "✂️";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            padding: 0 8px;
            font-size: 10px;
        }

        .payment-heading {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .account-owner {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .field-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .field-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-box {
            display: flex;
            align-items: center;
            background: #1c1c1c;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .copy-box:focus-within {
            border-color: #ffffff;
        }

        .copy-box input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            font-weight: 600;
        }

        .copy-btn {
            background-color: #ffffff;
            color: #0b0b0b;
            border: none;
            padding: 0 16px;
            height: 100%;
            min-height: 46px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover {
            background-color: #e0e0e0;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background-color: var(--success-color);
            color: white;
        }

        .instructions {
            margin-top: 22px;
            font-size: 12px;
            color: #d1d5db;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            line-height: 1.4;
        }

        .instructions strong {
            color: #ffffff;
        }

        footer {
            margin-top: 22px;
            font-size: 11px;
            color: #555555;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logotipo Oficial Estilizado -->
        <div class="logo-emblem">
            <div class="hat">🎩</div>
            <div class="brand-title">EL TRUCO</div>
            <div class="brand-subtitle">BARBERÍA</div>
            <div class="estd">ESTD 2018</div>
        </div>

        <div class="section-divider"></div>

        <div class="payment-heading">Mercado Pago</div>
        <div class="account-owner">Ismael Condori Huarayo</div>

        <!-- RUT -->
        <div class="field-group">
            <label>🆔 RUT</label>
            <div class="copy-box">
                <input type="text" id="rut" value="294120262" readonly>
                <button class="copy-btn" onclick="copyText('rut', this)">Copiar</button>
            </div>
        </div>

        <!-- Tipo de Cuenta -->
        <div class="field-group">
            <label>🏦 Tipo de cuenta</label>
            <div class="copy-box">
                <input type="text" id="tipo-cuenta" value="Cuenta Vista" readonly>
                <button class="copy-btn" onclick="copyText('tipo-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Número de cuenta -->
        <div class="field-group">
            <label>💳 Número de cuenta</label>
            <div class="copy-box">
                <input type="text" id="num-cuenta" value="1087437293" readonly>
                <button class="copy-btn" onclick="copyText('num-cuenta', this)">Copiar</button>
            </div>
        </div>

        <!-- Correo -->
        <div class="field-group">
            <label>✉️ Correo electrónico</label>
            <div class="copy-box">
                <input type="text" id="correo" value="ismael558@icloud.com" readonly>
                <button class="copy-btn" onclick="copyText('correo', this)">Copiar</button>
            </div>
        </div>

        <div class="instructions">
            <strong>⚠️ Importante:</strong> Envía tu comprobante de transferencia al barbero para confirmar tu atención.
        </div>

        <footer>
            El Truco Barbería © 2018 - 2026
        </footer>
    </div>

    <script>
        function copyText(elementId, buttonElement) {
            const inputElement = document.getElementById(elementId);
            
            navigator.clipboard.writeText(inputElement.value).then(() => {
                const originalText = buttonElement.innerHTML;
                
                buttonElement.innerHTML = '¡Copiado!';
                buttonElement.classList.add('copied');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalText;
                    buttonElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>
</body>
</html>
